name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Tests with branch coverage
        run: pytest -v --cov=src --cov-branch --cov-report=term-missing --junitxml=reports/junit.xml
      - name: Traceability matrix
        run: python -m tools.rtm | tee reports/rtm.txt
      - name: Mutation report
        run: python -m tools.mutation --write
      - name: Publish summary
        if: always()
        run: cat reports/mutation.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/
